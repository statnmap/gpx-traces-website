name: Verify PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This job name is the required status check on `main`: keep it stable.
  verify:
    runs-on: ubuntu-latest
    env:
      GPX_FILES_DIR: gpx-files-real-data
      TRACES_FILE_PATH: traces-real/traces.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only vulnerabilities in shipped (production) dependencies block the PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informative)
        run: npm audit || echo "::warning::npm audit reports vulnerabilities in dev dependencies (not blocking)."

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report to CODECOV
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

      # No Google Drive call on PRs: the build uses the fixtures, and the unit
      # tests use a mocked Drive client (the real one runs monthly, see
      # drive-monthly.yml).
      - name: Use test data as build data
        run: |
          mkdir -p "$GPX_FILES_DIR" "$(dirname "$TRACES_FILE_PATH")"
          cp tests/fixtures/site-data/gpx-files/*.gpx "$GPX_FILES_DIR/"
          cp tests/fixtures/site-data/traces.json "$TRACES_FILE_PATH"

      - name: Build website
        run: npm run build

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke test
        run: npm run test:ui

      - name: Upload UI coverage report to CODECOV
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-ui/lcov.info
          flags: ui
          fail_ci_if_error: false

      - name: Generate documentation
        run: npm run generate-docs
