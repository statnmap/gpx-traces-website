version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      # Run at 4:00 AM on Monday, 5 hours before deployment
      time: "04:00"
      day: "monday"
    target-branch: "main"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    # Group updates so that a single PR touches package-lock.json each week,
    # instead of many PRs conflicting with each other.
    # Major updates keep their own PR, so a breaking change is easy to spot.
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Keep GitHub Actions versions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
