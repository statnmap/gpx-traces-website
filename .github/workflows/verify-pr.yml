name: Verify PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This job name is the required status check on `main`: keep it stable.
  verify:
    runs-on: ubuntu-latest
    env:
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
      GOOGLE_DRIVE_FOLDER_ID_TEST: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID_TEST }}
      GPX_FILES_DIR: gpx-files-real-data
      TRACES_FILE_PATH: traces-real/traces.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Actions secrets are not exposed to Dependabot PRs: in that case the
      # Google Drive steps are skipped instead of failing the whole check.
      - name: Write Google Drive credentials
        id: drive
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: |
          if [ -n "$GOOGLE_DRIVE_CREDENTIALS" ]; then
            printf '%s' "$GOOGLE_DRIVE_CREDENTIALS" > credentials.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Google Drive credentials not available, Drive tests and data download are skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Only vulnerabilities in shipped (production) dependencies block the PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (informative)
        run: npm audit || echo "::warning::npm audit reports vulnerabilities in dev dependencies (not blocking)."

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report to CODECOV
        if: steps.drive.outputs.available == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          fail_ci_if_error: false

      - name: Run pre-build script
        if: steps.drive.outputs.available == 'true'
        run: node --experimental-vm-modules scripts/run-process-gpx.js

      - name: Use test data as build data
        if: steps.drive.outputs.available != 'true'
        run: |
          mkdir -p "$GPX_FILES_DIR" "$(dirname "$TRACES_FILE_PATH")"
          cp tests/fixtures/site-data/gpx-files/*.gpx "$GPX_FILES_DIR/"
          cp tests/fixtures/site-data/traces.json "$TRACES_FILE_PATH"

      - name: Build website
        run: npm run build

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke test
        run: npm run test:ui

      - name: Upload UI coverage report to CODECOV
        if: steps.drive.outputs.available == 'true'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-ui/lcov.info
          flags: ui
          fail_ci_if_error: false

      - name: Generate documentation
        run: npm run generate-docs
