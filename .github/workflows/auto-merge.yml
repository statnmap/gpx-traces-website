# .github/workflows/auto-merge.yml
# Enables GitHub auto-merge on Dependabot PRs. The PR is only merged once the
# required status check (`verify`, see verify-pr.yml) is green on `main`.
name: Auto-merge Dependabot
on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.PAT_AUTO_MERGE }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Update type: ${{ steps.metadata.outputs.update-type }} (${{ steps.metadata.outputs.dependency-names }})"
          gh pr merge --auto --squash "$PR_URL"
